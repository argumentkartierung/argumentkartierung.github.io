- name: Sebastian Cacean
  affiliation: Wissenschaftlicher Mitarbeiter
  href: https://sebastiancacean.de/
  thumbnail: /content/team/images/scacean.jpg
  description: |
    Sebastian Cacean studierte Physik und Philosophie und war in diversen Forschungsprojekten tätig, in denen er sich mit Fragen der angewandten Ethik, Wissenschaftstheorie und generativer KI beschäftigte. 

    In Forschung und Lehre analysiert er gern gesellschaftsrelevante Debatten, überlegt, wie inhaltsanalytische Methoden mit Hilfe von Sprachmodellen angewendet werden können, um den öffentlichen Diskurs zu analysieren und befasst sich mit der Verwendung von Methoden der Argumentkartierung zur Verbesserung deliberativer Praxis.

    Im Projekt ist Sebastian hauptverantwortlich für die Konzeption der interdisziplinären Seminare.
